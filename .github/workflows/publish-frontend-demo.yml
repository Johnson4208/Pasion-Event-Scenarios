name: Publish frontend preview to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'frontend-demo/**'
      - '.github/workflows/publish-frontend-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload frontend-only artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-demo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
