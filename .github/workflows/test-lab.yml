name: Project test lab
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'backend/distribution/recommendations.py'
      - 'backend/test_recommendation_distribution.py'
      - 'backend/distribution/lab.py'
      - 'backend/test_distribution_lab.py'
      - 'src/DistributionLab.jsx'
      - 'src/distribution-lab.scss'
      - 'testing/**'
      - 'scripts/test_lab.py'
      - '.github/workflows/test-lab.yml'
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend -p test_recommendation_distribution.py
      - run: python testing/simulate_distribution.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-synthetic-results
          path: artifacts/distribution-lab.json
  admin-lab-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s backend -p test_distribution_lab.py
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node testing/admin_lab_ui.mjs
  full-project:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements-documents.txt
      - run: python scripts/test_lab.py --ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-project-test-results
          path: artifacts/test-lab/
